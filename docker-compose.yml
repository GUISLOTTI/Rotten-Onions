# RabbitMQ para o Rotten Onions.
# Subir:   docker compose up -d
# Painel:  http://localhost:15672   (usuário: rotten / senha: onions)
# Derrubar: docker compose down     (adicione -v para apagar os dados)

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rotten-onions-rabbitmq
    ports:
      - "5672:5672"      # AMQP — a aplicação conecta aqui
      - "15672:15672"    # Painel web de gerenciamento
    environment:
      RABBITMQ_DEFAULT_USER: rotten
      RABBITMQ_DEFAULT_PASS: onions
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── OPCIONAL ────────────────────────────────────────────────
